<text x="730" y="102" font-size="12.5" font-weight="bold" fill="#333333">IT load destruction  20.07 MW</text>
<text x="730" y="120" font-size="12.5" fill="#666666">not attributable to the plant: the IT load turns</text>
<text x="730" y="136.25" font-size="12.5" fill="#666666">its electricity into low-grade heat</text>
<text x="730" y="231.43" font-size="12.5" fill="#333333">surplus electricity  0.60 MW</text>
<text x="730" y="265.43" font-size="12.5" fill="#333333">delivered heat  0.42 MW</text>
<rect x="700" y="372" width="284" height="184" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
<text x="714" y="397" font-size="13.5" font-weight="bold" fill="#333333">Second-law efficiency 34.9 %</text>
<text x="714" y="418" font-size="12.5" fill="#666666">First-law efficiency is 59.9 %. The</text>
<text x="714" y="434.25" font-size="12.5" fill="#666666">chilled-water loop removes 10.0 MW of heat</text>
<text x="714" y="450.5" font-size="12.5" fill="#666666">but delivers only 0.07 MW of exergy. The dry</text>
<text x="714" y="466.75" font-size="12.5" fill="#666666">cooler dissipates 22.8 MW to ambient, and</text>
<text x="714" y="483" font-size="12.5" fill="#666666">heat at ambient temperature carries no</text>
<text x="714" y="499.25" font-size="12.5" fill="#666666">exergy. Of 60.5 MW of fuel exergy, 32.0 MW</text>
<text x="714" y="515.5" font-size="12.5" fill="#666666">is destroyed inside the plant, mostly in the</text>
<text x="714" y="531.75" font-size="12.5" fill="#666666">combustor.</text>
<text x="40" y="664" font-size="11.5" fill="#666666">Simulation, one solved plant (n = 1): gas turbine (pressure ratio 18, inlet 1500 K), absorption cooling, dry cooler, 4 MW district heat from the exhaust, 20 MW IT load, ambient 298.15 K.</text>
<text x="40" y="678.95" font-size="11.5" fill="#666666">Exergy in MW; closure residual below 1e-9 MW.</text>
