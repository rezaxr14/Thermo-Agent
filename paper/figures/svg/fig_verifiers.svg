<text x="90" y="821" font-size="12.5" fill="#333333">IT load within 1 %; no electricity deficit unless grid import is allowed;</text>
<text x="90" y="836.5" font-size="12.5" fill="#333333">cooling and heat at least 99 %; water limit</text>
