<g class="arrow" data-src="gA" data-dst="gB"><path d="M758,108 L844,108" fill="none" stroke="#4C72B0" stroke-width="2.2" stroke-linejoin="round"/><polygon points="852,108 844,111.4 844,104.6" fill="#4C72B0"/></g>
<g class="arrow" data-src="gB"><path d="M922,108 L962,108" fill="none" stroke="#DD8452" stroke-width="2.2" stroke-linejoin="round"/><polygon points="970,108 962,111.4 962,104.6" fill="#DD8452"/></g>
<text x="660" y="100" font-size="12.5" font-family="Courier, 'Liberation Mono', monospace" font-weight="bold" text-anchor="middle" fill="#8A4B06">E_f</text>
<text x="805" y="100" font-size="12.5" font-family="Courier, 'Liberation Mono', monospace" font-weight="bold" text-anchor="middle" fill="#34548A">E_x</text>
<text x="948" y="100" font-size="12.5" font-family="Courier, 'Liberation Mono', monospace" font-weight="bold" text-anchor="middle" fill="#8A4B06">E_g</text>
<text x="642" y="158" font-size="12" font-family="Courier, 'Liberation Mono', monospace" fill="#333333">ED_A = E_f - E_x - W_A</text>
<text x="642" y="175" font-size="12" font-family="Courier, 'Liberation Mono', monospace" fill="#333333">ED_B = E_x - E_g - W_B</text>
<text x="642" y="192" font-size="12" font-family="Courier, 'Liberation Mono', monospace" fill="#333333">closure = ED_A + ED_B</text>
<text x="714.01" y="209" font-size="12" font-family="Courier, 'Liberation Mono', monospace" fill="#333333">- (E_f - E_g - W_A - W_B)</text>
<text x="699.61" y="226" font-size="12" font-family="Courier, 'Liberation Mono', monospace" fill="#333333">= 0 for any E_f, E_x, E_g</text>
<text x="642" y="257" font-size="13" font-weight="bold" fill="#333333">Closure residual after one edit to a real ledger</text>
<rect x="640" y="273" width="330" height="32" rx="7" fill="#EDF7F0" stroke="#55A868" stroke-width="1.3"/>
<path d="M650,289.7 L655.32,294.88 L664,283.4" fill="none" stroke="#2F6B3C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="672" y="294" font-size="12" fill="#333333">double E[s2], an internal stream</text>
<text x="960" y="294" font-size="12.5" font-weight="bold" text-anchor="end" fill="#2F6B3C">0</text>
<rect x="640" y="313" width="330" height="32" rx="7" fill="#EDF7F0" stroke="#55A868" stroke-width="1.3"/>
<path d="M650,329.7 L655.32,334.88 L664,323.4" fill="none" stroke="#2F6B3C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="672" y="334" font-size="12" fill="#333333">double E[fuel], a boundary stream</text>
<text x="960" y="334" font-size="12.5" font-weight="bold" text-anchor="end" fill="#2F6B3C">0</text>
<rect x="640" y="353" width="330" height="32" rx="7" fill="#EDF7F0" stroke="#55A868" stroke-width="1.3"/>
<path d="M650,369.7 L655.32,374.88 L664,363.4" fill="none" stroke="#2F6B3C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="672" y="374" font-size="12" fill="#333333">change T0 to 273.15 K</text>
<text x="960" y="374" font-size="12.5" font-weight="bold" text-anchor="end" fill="#2F6B3C">0</text>
<rect x="640" y="393" width="330" height="32" rx="7" fill="#FBECEC" stroke="#B5383C" stroke-width="1.3"/>
<path d="M652,404 L662,414 M662,404 L652,414" fill="none" stroke="#B5383C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="672" y="414" font-size="12" fill="#333333">drop the work term from ED[AC]</text>
<text x="960" y="414" font-size="12.5" font-weight="bold" text-anchor="end" fill="#8E2A2E">-8.73 MW</text>
<text x="642" y="439" font-size="12" font-weight="bold" fill="#34548A">Only an error inside an ED line moves the residual; a</text>
<text x="642" y="454.6" font-size="12" font-weight="bold" fill="#34548A">wrong stream value never does.</text>
<text x="642" y="485" font-size="13" font-weight="bold" fill="#333333">Across all generated ledger rows</text>
<text x="642" y="513" font-size="12" fill="#333333">stream-line or constant faults only</text>
<rect x="642" y="521" width="200" height="12" rx="3" fill="#E6E6E8"/>
<text x="850" y="532" font-size="12.5" font-weight="bold" fill="#2F6B3C">0 of 238 rows</text>
<text x="642" y="559" font-size="12" fill="#333333">a component-line fault present</text>
<rect x="642" y="567" width="200" height="12" rx="3" fill="#E6E6E8"/>
<rect x="642" y="567" width="199.45" height="12" rx="3" fill="#B5383C"/>
<text x="850" y="578" font-size="12.5" font-weight="bold" fill="#8E2A2E">361 of 362 rows</text>
<text x="16" y="898" font-size="11.5" fill="#666666">Tolerances from verify/verifiers.py and verify/grounding.py. Closure counts: synthetic ledger rows, n = 600, seed 0; worked example: row led-0-00001.</text>
