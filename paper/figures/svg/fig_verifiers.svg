<text x="668" y="44" font-size="14" font-weight="bold" fill="#34548A">Why the closure check misses stream errors</text>
<text x="642" y="66" font-size="12" fill="#666666">ledger task: ED_c = sum E_in - sum E_out - W_c</text>
<rect x="688" y="86" width="70" height="44" id="gA" rx="8" fill="#EEF3FA" stroke="#4C72B0" stroke-width="1.6"/>
<text x="723" y="113.02" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">A</text>
<rect x="852" y="86" width="70" height="44" id="gB" rx="8" fill="#EEF3FA" stroke="#4C72B0" stroke-width="1.6"/>
<text x="887" y="113.02" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">B</text>
