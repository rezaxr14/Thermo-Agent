<text x="970" y="166" font-size="12.5" text-anchor="end" fill="#333333">25.2 ms</text>
<text x="754" y="190" font-size="12.5" font-weight="bold" fill="#5A4B8A">ledger</text>
<text x="970" y="190" font-size="12.5" text-anchor="end" fill="#333333">0.9 ms</text>
<text x="754" y="228" font-size="12" fill="#666666">time for one fresh evaluation of a</text>
<text x="754" y="243.5" font-size="12" fill="#666666">completion (solve and all checks) on</text>
<text x="754" y="259" font-size="12" fill="#666666">one CPU core. A group whose</text>
<text x="754" y="274.5" font-size="12" fill="#666666">completions all earn the same reward</text>
<text x="754" y="290" font-size="12" fill="#666666">gives GRPO no learning signal; smaller</text>
<text x="754" y="305.5" font-size="12" fill="#666666">groups make that more likely.</text>
<text x="16" y="458" font-size="11.5" fill="#666666">Simulation, no model: 40 groups per task and level, seed 0; train.reward_diagnostics.diagnose on training rows. Each simulated completion is the expert answer, damaged with probability p</text>
<text x="16" y="472.95" font-size="11.5" fill="#666666">(the error rate).</text>
