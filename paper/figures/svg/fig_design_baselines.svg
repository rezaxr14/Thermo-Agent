<text x="784" y="94" font-size="13" font-weight="bold" fill="#333333">Reading the curves</text>
<text x="784" y="116" font-size="12" fill="#666666">120 sites held out of training</text>
<text x="784" y="131.5" font-size="12" fill="#666666">(four held-out splits).</text>
<text x="784" y="147" font-size="12" fill="#666666">Reference: the best of</text>
<text x="784" y="162.5" font-size="12" fill="#666666">enumeration plus polishing, 144</text>
<text x="784" y="178" font-size="12" fill="#666666">evaluations at most. After 16</text>
<text x="784" y="193.5" font-size="12" fill="#666666">evaluations: enumeration 0 %,</text>
<text x="784" y="209" font-size="12" fill="#666666">random 20 %, polish 0 %. After</text>
<text x="784" y="224.5" font-size="12" fill="#666666">128: 57 %, 67 %, 99 %. The</text>
<text x="784" y="240" font-size="12" fill="#666666">polish curve runs the procedure</text>
<text x="784" y="255.5" font-size="12" fill="#666666">that defines the reference, so it</text>
<text x="784" y="271" font-size="12" fill="#666666">shows speed to the reference, not</text>
<text x="784" y="286.5" font-size="12" fill="#666666">independent quality.</text>
<text x="16" y="492" font-size="11.5" fill="#666666">Simulation, n = 120 sites, seed 0; each point is the share of sites whose best design after that many evaluations is within 2 % of the reference (a site with no valid design counts as outside).</text>
