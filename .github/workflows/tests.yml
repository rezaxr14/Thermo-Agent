# Not executed by the author (no CI runner was available); the same commands pass locally.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e . --no-deps
      - run: python -m thermo_agent.agent.build_harness --check
      - run: pytest -q
