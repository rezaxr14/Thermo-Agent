[project]
name = "thermo-agent"
version = "0.1.0"
description = "Second-law-verified AI agents for on-site CHP and heat recovery in AI data centres"
requires-python = ">=3.10"
dependencies = ["CoolProp==8.0.0", "numpy", "scipy", "pydantic>=2", "pandas", "openpyxl"]
[project.optional-dependencies]
dev = ["pytest", "cantera"]   # cantera only to regenerate core/data/nasa7_gri30.json
train = ["torch", "transformers", "datasets", "accelerate", "peft", "trl", "bitsandbytes"]   # TRL 1.17.1 was the version inspected when writing the scripts
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["thermo_agent*"]
[tool.setuptools.package-data]
thermo_agent = ["core/data/*.json"]
